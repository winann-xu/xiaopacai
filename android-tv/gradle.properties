# [android-tv] Gradle 属性 — 小趴菜 TVOS 版
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false

# === APK 签名密钥（从用户级文件读取，不入库） ===
# 生成方式: keytool -genkey -v -keystore xiaopacai-tvos.jks -alias xiaopacai-tvos -keyalg RSA -keysize 2048 -validity 10000
# 使用时通过 gradle.properties 传入，或创建 ~/.gradle/gradle.properties
# XPC_KEYSTORE=/path/to/xiaopacai-tvos.jks
# XPC_KEY_ALIAS=xiaopacai-tvos
# XPC_KEY_PASSWORD=your_key_password
# XPC_KEYSTORE_PASSWORD=your_keystore_password
XPC_KEYSTORE=
XPC_KEY_ALIAS=
XPC_KEY_PASSWORD=
XPC_KEYSTORE_PASSWORD=

# 签名文件路径（侧载用默认 debug 签名）
# 如果上述为空，自动使用 debug 签名
